---
apiVersion: v1
kind: ReplicationController
metadata:
  name: recsvc
spec:
  replicas: 3
  selector:
    app: stockmarket
  template:
    metadata:
      labels:
        app: stockmarket
    spec:
      containers:
        - name: cont2
          image: ayyappaad/dj:stockmarket
          ports:
            - containerPort: 80


---
---
apiVersion: v1
kind: Service
metadata:
  name: mysvc5
spec:
  type: LoadBalancer
  selector:
    app: stockmarket
  ports:
    - port: 80
      targetPort: 80
